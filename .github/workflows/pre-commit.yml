name: Linting
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  linting:
    name: All file linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-python: true
      - uses: j178/prek-action@v3.0.0
